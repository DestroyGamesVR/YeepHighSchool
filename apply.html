<script>
  document.getElementById('teacherForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value;
    const classType = document.getElementById('classType').value;
    const level = document.getElementById('level').value;
    const details = document.getElementById('details').value;

    const formData = {
      // REPLACE THIS STRING WITH YOUR WEB3FORMS ACCESS KEY
      access_key: "ebd28397-8b6a-4632-8557-c9f8f33b2758", 
      subject: "New Teacher Application",
      username: username,
      classType: classType,
      level: level,
      details: details
    };

    // 1. Send data to Web3Forms in the background
    try {
      await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Accept: "application/json"
        },
        body: JSON.stringify(formData)
      });
    } catch (error) {
      console.error("Submission error:", error);
    }

    // 2. Save locally so it appears in the list on the page right away
    const newApp = { username, classType, level, details };
    let apps = JSON.parse(localStorage.getItem('teacherApps') || '[]');
    apps.unshift(newApp);
    localStorage.setItem('teacherApps', JSON.stringify(apps));

    renderApps();
    this.reset();
  });

  function renderApps() {
    const container = document.getElementById('applicationsList');
    let apps = JSON.parse(localStorage.getItem('teacherApps') || '[]');

    if(apps.length === 0){
      container.innerHTML = '<p style="color:#777; font-size:0.9rem;">No applications submitted yet.</p>';
      return;
    }

    container.innerHTML = apps.map(app => `
      <div class="app-card">
        <div class="meta">
          <span>${app.username}</span>
          <span>${app.level}</span>
        </div>
        <h4>${app.classType}</h4>
        <p>${app.details}</p>
      </div>
    `).join('');
  }

  renderApps();
</script>
